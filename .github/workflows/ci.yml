name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build e testes do core
        run: |
          cmake -S . -B build -DARF_BUILD_APP=OFF
          cmake --build build
          ctest --test-dir build --output-on-failure

  qml-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Config
        run: cat ci/config.env >> "$GITHUB_ENV"
      - name: Dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1 libegl1 libxkbcommon0 libfontconfig1 libglib2.0-0
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          cache: true
      - name: Teste de fumaça do QML
        run: bash scripts/ci-smoke.sh
      - name: Comentar erro na PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const t = fs.existsSync('build.log')
              ? fs.readFileSync('build.log', 'utf8').split('\n').slice(-80).join('\n')
              : '(sem log)';
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: '**Erro no job ' + context.job + '**\n```\n' + t + '\n```'
            });

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Config
        run: cat ci/config.env >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Qt (desktop + Android)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: android
          arch: android_arm64_v8a
          extra: --autodesktop
          cache: true
      - name: Compilar APK
        run: bash scripts/ci-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: AnimatorRF-apk
          path: build-android/**/*.apk
      - name: Comentar erro na PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const t = fs.existsSync('build.log')
              ? fs.readFileSync('build.log', 'utf8').split('\n').slice(-80).join('\n')
              : '(sem log)';
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: '**Erro no job ' + context.job + '**\n```\n' + t + '\n```'
            });
