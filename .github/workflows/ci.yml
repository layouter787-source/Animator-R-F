name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build e testes do core
        run: |
          cmake -S . -B build -DARF_BUILD_APP=OFF
          cmake --build build
          ctest --test-dir build --output-on-failure

  android:
    runs-on: ubuntu-latest
    env:
      QT_VERSION: 6.8.1
      NDK_VERSION: 26.1.10909125
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Qt (desktop + Android)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: android
          arch: android_arm64_v8a
          extra: --autodesktop
      - name: NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}" "platforms;android-34" "build-tools;34.0.0"
      - name: Configurar e compilar APK
        run: |
          "$QT_ROOT_DIR/bin/qt-cmake" -S . -B build-android -G Ninja \
            -DQT_HOST_PATH="$QT_HOST_PATH" \
            -DANDROID_SDK_ROOT="$ANDROID_HOME" \
            -DANDROID_NDK_ROOT="$ANDROID_HOME/ndk/${NDK_VERSION}" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-android --target apk
      - uses: actions/upload-artifact@v4
        with:
          name: AnimatorRF-apk
          path: build-android/**/*.apk
